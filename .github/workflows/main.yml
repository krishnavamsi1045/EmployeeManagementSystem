name: Deploy to Azure

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Login to ACR
        run: az acr login --name secondversionoflearningregistry

      - name: Build and Tag Docker image
        run: |
          docker build -t secondversionoflearningregistry.azurecr.io/employeemanagment:latest .

      - name: Push Docker image
        run: |
          docker push secondversionoflearningregistry.azurecr.io/employeemanagment:latest

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name employeemanagment \
            --resource-group secondgroup \
            --image secondversionoflearningregistry.azurecr.io/employeemanagment:latest
